/* the short link keeps what the link carried (?c= a run to pass, ?from= a source) and adds the name of the site that sent the visitor, its name only */
(function () {
  var q = new URLSearchParams(location.search), h = '';
  try { h = document.referrer ? new URL(document.referrer).hostname : ''; } catch (e) { h = ''; }
  if (h && h.indexOf('aztmm.com') < 0 && !q.get('from')) q.set('from', h.toLowerCase().replace(/^www\./, '').replace(/[^a-z0-9.-]/g, '').slice(0, 24));
  var s = q.toString();
  location.replace('../play/lea.html' + (s ? '?' + s : ''));
})();
</script>
