<script>

// 01_cards.js: civilisations, cards, decks. Every number here is tuning.
// Field units: y runs 0 (your king tower) to 1 (theirs). Speeds in field-lengths per second. Ranges in field units.
const RB = {};

const CIVS = {
  rome:     { name: 'Rome', palette: { body: '#b3262e', dark: '#4e1015', cloth: '#c63a38', metal: '#b98a3e', flag: '#e0b04c' },

  vikings:  { name: 'Vikings', palette: { body: '#2f6f8f', dark: '#14181d', cloth: '#3f86a8', metal: '#8d949c', flag: '#1b1d22' },
              rule: 'moatrush', ruleName: 'Sea legs', ruleText: 'Units move 40% faster once they have crossed the moat.',
              hero: 'vikings_jarl', spell: 'vikings_raven', heroMove: 'Berserk', epithet: 'The Raiders',
              blurb: 'Slow to leave the shore, hard to stop once over the water.' },
  marathas: { name: 'Marathas', palette: { body: '#f08a1c', dark: '#6b3d0c', cloth: '#f29a2e', metal: '#9aa0a6', flag: '#c9791a' },

  aztecs:   { name: 'Aztecs', palette: { body: '#2f9a72', dark: '#0f3f30', cloth: '#2bb7b0', metal: '#c8b27a', flag: '#c4282e' },
              rule: 'refund', ruleName: 'Blood price', ruleText: 'Every enemy unit felled gives back 1 energy.',
              hero: 'aztecs_eagleknight', spell: 'aztecs_flowerwar', heroMove: 'Sky fall', epithet: 'The Causeway Kings',
              blurb: 'Every kill pays for the next card, so keep fighting.' },
  samurai:  { name: 'Samurai', palette: { body: '#2c3a7a', dark: '#141a3c', cloth: '#a8222a', metal: '#cfd3d8', flag: '#f2eee4' },
              rule: 'crit', ruleName: 'One cut', ruleText: 'Single units deal a double-damage critical hit on every fourth strike.',
              hero: 'samurai_ronin', spell: 'samurai_kiai', heroMove: 'Duel', epithet: 'The Castle Lords',
              blurb: 'A few good fighters beat a crowd. Let them find the opening.' },
  egypt:    { name: 'Egypt', palette: { body: '#d6b25a', dark: '#6a5120', cloth: '#26479e', metal: '#e9d38a', flag: '#26479e' },
              rule: 'repair', ruleName: 'Eternal stone', ruleText: 'Towers have 20% more health and mend 1% a second when no enemy is near.',
              hero: 'egypt_champion', spell: 'egypt_flood', heroMove: 'Sandstorm', epithet: 'The Temple Walls',
              blurb: 'Outlast them. The walls were old before anyone else arrived.' }
};

// Role baselines. A card overrides only what makes it different.
const BASE = {
  shield: { cost: 3, count: 2, hp: 170, dmg: 20, hitEvery: 1.2, speed: 0.10, range: 0.045, targets: 'any' },
  blade:  { cost: 3, count: 1, hp: 290, dmg: 52, hitEvery: 1.0, speed: 0.15, range: 0.05,  targets: 'any' },
  swarm:  { cost: 2, count: 3, hp: 52,  dmg: 17, hitEvery: 0.8, speed: 0.17, range: 0.04,  targets: 'any' },
  bow:    { cost: 3, count: 2, hp: 58,  dmg: 26, hitEvery: 1.2, speed: 0.12, range: 0.19,  targets: 'any' },
  horse:  { cost: 3, count: 1, hp: 210, dmg: 52, hitEvery: 1.1, speed: 0.25, range: 0.05,  targets: 'any' },
  siege:  { cost: 4, count: 1, hp: 220, dmg: 100, hitEvery: 2.2, speed: 0.07, range: 0.30, targets: 'buildings' },
  hero:   { cost: 5, count: 1, hp: 480, dmg: 68, hitEvery: 1.0, speed: 0.15, range: 0.05,  targets: 'any' },
  spell:  { cost: 3, count: 0 }
};

// Balance scalars on hp and dmg per civ, found by node test/bot.js over all 30 ordered civ pairs. Change them there, not card by card.
const TUNE = { rome: 0.99, vikings: 1.38, marathas: 0.77, aztecs: 0.88, samurai: 1.36, egypt: 1.34 };

const CARDS = {};
function def(civ, key, role, o) {
  const id = civ + '_' + key;
  const c = Object.assign({ id: id, civ: civ, role: role }, BASE[role], o);
  if (role !== 'spell') { c.hp = Math.round(c.hp * TUNE[civ]); c.dmg = Math.round(c.dmg * TUNE[civ]); }
  CARDS[id] = c;
}

// ---- Rome ----
def('rome', 'legionary', 'shield', { name: 'Legionaries', hp: 185, dmg: 18,
  blurb: 'Two heavy shields that lock together and shrug off the first blows.' });

  blurb: 'One man who has done this for a crowd, and does it well.' });

  blurb: 'Cavalry from the wings of the army, quick to run down archers.' });

def('rome', 'pilum', 'spell', { name: 'Pilum volley', cost: 3, dmg: 85, spellKind: 'aoe',
  blurb: 'A cloud of heavy javelins comes down on everything in the lane.' });

// ---- Vikings ----
def('vikings', 'shieldwall', 'shield', { name: 'Shield wall', hp: 175,
  blurb: 'Painted round shields in a line. Hard to dent, slow to get anywhere.' });
def('vikings', 'berserker', 'blade', { name: 'Berserker', hp: 270, dmg: 55, rage: true,
  blurb: 'The more he bleeds the faster he swings.' });
def('vikings', 'raiders', 'swarm', { name: 'Raiders',
  blurb: 'Three men with axes who came for the farm and stayed for the fight.' });
def('vikings', 'bowmen', 'bow', { name: 'Bowmen',

def('vikings', 'longship', 'horse', { name: 'Longship', cost: 4, hp: 200, dmg: 40, hitEvery: 1.0, speed: 0.30, range: 0.20, water: true,

def('vikings', 'ram', 'siege', { name: 'Battering ram', hp: 300, dmg: 90, range: 0.05, speed: 0.08,

def('vikings', 'raven', 'spell', { name: "Raven's call", cost: 2, spellKind: 'slow',

// ---- Marathas ----
def('marathas', 'shiledar', 'shield', { name: 'Shiledar', hp: 180, dmg: 20,

def('marathas', 'dandpatta', 'blade', { name: 'Dandpatta', cleave: 0.06,

def('marathas', 'mavale', 'swarm', { name: 'Mavale',
  blurb: 'Three hill men from the valleys, quick on their feet and used to being outnumbered.' });
def('marathas', 'hetkari', 'bow', { name: 'Hetkari', range: 0.24, dmg: 30, hitEvery: 1.4, hp: 55,
  blurb: 'Musketeers with a long reach and a slow reload.' });
def('marathas', 'bargir', 'horse', { name: 'Bargir', charge: 2.0, hp: 200,

def('marathas', 'rocketcart', 'siege', { name: 'Rocket cart', dmg: 85, hp: 190, range: 0.28, splash: 0.07,

def('marathas', 'raje', 'hero', { name: 'The Raje', as: 'blade', hp: 470, dmg: 66, power: 'nightraid',

def('marathas', 'ghorpad', 'spell', { name: 'Ghorpad', cost: 3, dmg: 300, spellKind: 'tower',
  blurb: 'A monitor lizard climbs the wall in the night. The tower in that lane takes 300.' });

// ---- Aztecs ----
def('aztecs', 'jaguar', 'shield', { name: 'Jaguar warriors', hp: 175, dmg: 21,
  blurb: 'Spotted pelts, wooden shields, and a very solid line.' });
def('aztecs', 'eagle', 'blade', { name: 'Eagle warrior', hp: 250, dmg: 50, leap: 0.20,
  blurb: 'He jumps the gap to his target and hits harder for it.' });
def('aztecs', 'levies', 'swarm', { name: 'Levies',
  blurb: 'Three young men with clubs and slings who go where they are told.' });
def('aztecs', 'atlatl', 'bow', { name: 'Atlatl throwers',
  blurb: 'Spear-throwers that send a dart a long way for very little cost.' });
def('aztecs', 'runners', 'horse', { name: 'Runners', cost: 3, count: 2, hp: 85, dmg: 26, hitEvery: 0.9, speed: 0.38,
  blurb: 'The fastest feet in the game, two of them, and nothing to protect them.' });
def('aztecs', 'firebearers', 'siege', { name: 'Fire bearers', count: 2, cost: 3, hp: 80, dmg: 52, hitEvery: 1.4, speed: 0.22, range: 0.04,
  blurb: 'Two torch carriers running at the tower to set it alight.' });
def('aztecs', 'eagleknight', 'hero', { name: 'The Eagle Knight', as: 'horse', hp: 470, dmg: 62, power: 'skyfall',
  blurb: 'He leaps the moat and lands hard enough to throw the enemy back.' });
def('aztecs', 'flowerwar', 'spell', { name: 'Flower war', cost: 3, spellKind: 'chaos',
  blurb: 'The enemy in that lane forgets who they came for and turns on each other for three seconds.' });

// ---- Samurai ----
def('samurai', 'ashigaru', 'shield', { name: 'Ashigaru spears', hp: 170, dmg: 21, range: 0.055,
  blurb: 'Foot soldiers with long spears who keep an enemy at arm and a half.' });
def('samurai', 'samurai', 'blade', { name: 'Samurai', hp: 290, dmg: 52,
  blurb: 'A lone swordsman. Every fourth cut is twice as hard.' });
def('samurai', 'peasants', 'swarm', { name: 'Peasant levy',
  blurb: 'Three farmers with whatever the village could spare.' });
def('samurai', 'archers', 'bow', { name: 'Ashigaru archers',
  blurb: 'Archers in lacquered hats, shooting in volleys from behind the line.' });
def('samurai', 'yabusame', 'horse', { name: 'Yabusame', cost: 4, hp: 200, dmg: 30, hitEvery: 1.1, speed: 0.24, range: 0.17, mobile: true,
  blurb: 'A horse archer who keeps shooting while he rides.' });
def('samurai', 'ozutsu', 'siege', { name: 'Ozutsu', hp: 190, dmg: 230, hitEvery: 3.2, range: 0.13,
  blurb: 'A hand cannon the size of a drum. It must get close, and then it hits very hard.' });
def('samurai', 'ronin', 'hero', { name: 'The Ronin', as: 'blade', hp: 440, dmg: 72, power: 'duel',
  blurb: 'He picks the strongest enemy in the lane and no one else is allowed in until one of them falls.' });
def('samurai', 'kiai', 'spell', { name: 'Kiai', cost: 2, spellKind: 'haste',
  blurb: 'A shout from the line. Your fighters in the lane strike at once and swing faster for three seconds.' });

// ---- Egypt ----
def('egypt', 'shieldbearers', 'shield', { name: 'Shieldbearers', hp: 175,
  blurb: 'Tall shields of ox hide, carried by men who guard a temple wall for a living.' });
def('egypt', 'khopesh', 'blade', { name: 'Khopesh guard', hp: 300, dmg: 50,
  blurb: 'A sickle sword that hooks the shield out of the way.' });
def('egypt', 'levies', 'swarm', { name: 'Nile levy',
  blurb: 'Three river farmers with sticks, sent in numbers.' });
def('egypt', 'archers', 'bow', { name: 'Composite archers', range: 0.21,
  blurb: 'Horn and sinew bows with a reach that surprises people.' });
def('egypt', 'chariot', 'horse', { name: 'War chariot', cost: 4, hp: 240, dmg: 50, charge: 1.5, chargeSplash: 0.07,
  blurb: 'Its first hit after a run throws the people next to the target around too.' });
def('egypt', 'obeliskram', 'siege', { name: 'Obelisk ram', hp: 340, dmg: 95, range: 0.05, speed: 0.07,
  blurb: 'A carved pillar of granite carried on logs. It goes through gates.' });
def('egypt', 'champion', 'hero', { name: "The Pharaoh's Champion", as: 'blade', hp: 500, dmg: 66, power: 'sandstorm',
  blurb: 'A wall of sand blinds the lane for four seconds. Enemy archers and towers cannot shoot.' });
def('egypt', 'flood', 'spell', { name: 'Flood', cost: 3, spellKind: 'flood',
  blurb: 'The river rises and both bridges are shut for four seconds.' });

const ROLE_BEATS = { shield: ['blade', 'horse'], blade: ['swarm'], swarm: ['shield'], bow: ['blade', 'shield'], horse: ['bow', 'siege'], siege: [] };

const DECKS = {};
for (const civ in CIVS) {
  DECKS[civ] = Object.keys(CARDS).filter(function (id) { return CARDS[id].civ === civ; });
}

const TOWER = { outer: { hp: 1400, dmg: 40, hitEvery: 0.8, range: 0.24 }, king: { hp: 2400, dmg: 55, hitEvery: 1.0, range: 0.26 } };
const MATCH = { seconds: 180, overtime: 60, energyMax: 10, energyPerSec: 1.0, lateEnergyPerSec: 2.0, lateAt: 60, handSize: 4 };

RB.CIVS = CIVS; RB.CARDS = CARDS; RB.ROLE_BEATS = ROLE_BEATS; RB.DECKS = DECKS; RB.TOWER = TOWER; RB.MATCH = MATCH;

</script>
<script>
// Epoch. An AZTMM game. (c) 2026 AZTMM HLDGS LLC.
// 02_rules.js: the match, engine-free. Field coordinates: x in [0,1] (left to right), y in [0,1] (your side 0, theirs 1).
// Deterministic for a seed (M.rng only), so the headless bot and the page play the same match.

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const FIELD = {
  riverY: 0.5, bridges: [0.22, 0.78], bridgeHalf: 0.06, band: 0.075,
  towers: function (side) {
    const y1 = side === 0 ? 0.17 : 0.83, y2 = side === 0 ? 0.07 : 0.93;
    return [{ kind: 'outer', x: 0.22, y: y1 }, { kind: 'outer', x: 0.78, y: y1 }, { kind: 'king', x: 0.5, y: y2 }];
  }
};
const MULT = 1.6;
const LANE_X = [0.25, 0.75];
function laneOf(x) { return x < 0.5 ? 0 : 1; }
function enemyOf(side) { return 1 - side; }
function dist(a, b) { const dx = a.x - b.x, dy = (a.y - b.y) * 1.6; return Math.sqrt(dx * dx + dy * dy); }
function fightRole(x) { return x.kind ? 'tower' : (x.as || x.role); }

function newMatch(opts) {
  const o = opts || {};
  const seed = o.seed || 1;
  const rng = mulberry(seed);
  const civs = [o.civ0 || o.faction0 || 'marathas', o.civ1 || o.faction1 || 'rome'];
  const M = { t: 0, seed: seed, rng: rng, over: false, winner: -1, reason: '', sudden: false, events: [], units: [], towers: [], nextId: 1,
              players: [], log: [], storms: [], flood: null, timeScale: 1 };
  const decks = [o.deck0 || RB.DECKS[civs[0]], o.deck1 || RB.DECKS[civs[1]]];
  for (let s = 0; s < 2; s++) {
    const deck = decks[s].slice();
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
    const P = { side: s, civ: civs[s], energy: 5, deck: deck, hand: deck.splice(0, RB.MATCH.handSize), next: null, towersLost: 0 };
    P.next = P.deck[0];
    M.players.push(P);
    const hpMul = civs[s] === 'egypt' ? 1.2 : 1;
    for (const t of FIELD.towers(s)) {
      const hp = Math.round(RB.TOWER[t.kind].hp * hpMul);
      M.towers.push({ id: M.nextId++, side: s, civ: civs[s], role: 'tower', kind: t.kind, x: t.x, y: t.y, hp: hp, maxHp: hp, cd: 0, alive: true, awake: t.kind !== 'king', rlast: -9 });
    }
  }
  return M;
}

function say(M, text, side) { M.log.push({ t: M.t, text: text, side: side }); if (M.log.length > 40) M.log.shift(); }
function event(M, e) { e.t = M.t; M.events.push(e); }
function civrule(M, who, rule, x, y, throttle) {
  if (throttle && M.t - (who.rlast || -9) < throttle) return;
  who.rlast = M.t;
  event(M, { kind: 'civrule', civ: who.civ, rule: rule, x: x, y: y, side: who.side });
}

function cardCost(M, side, id, y) {
  const c = RB.CARDS[id]; let cost = c.cost;
  if (M.players[side].civ === 'marathas' && y != null) {
    const third = FIELD.riverY / 3;
    if (side === 0 ? y < third : y > 1 - third) cost = Math.max(1, cost - 1);
  }
  return cost;
}

function canDeploy(M, side, x, y) {
  if (y < 0.02 || y > 0.98 || x < 0.04 || x > 0.96) return false;
  const own = side === 0 ? y < FIELD.riverY - 0.02 : y > FIELD.riverY + 0.02;
  if (own) return true;
  const lane = laneOf(x);
  const t = M.towers.find(function (q) { return q.side === enemyOf(side) && q.kind === 'outer' && laneOf(q.x) === lane; });
  if (t && !t.alive) return side === 0 ? y < t.y - 0.03 : y > t.y + 0.03;
  return false;
}

function spawnUnit(M, side, card, x, y) {
  const civ = M.players[side].civ;
  const u = { id: M.nextId++, side: side, civ: civ, card: card.id, body: card.id, role: card.role, as: card.as || null, x: x, y: y,
              hp: card.hp, maxHp: card.hp, dmg: card.dmg, hitEvery: card.hitEvery, cd: 0.3, speed: card.speed, range: card.range, targets: card.targets,
              splash: card.splash || 0, charge: card.charge || 0, chargeSplash: card.chargeSplash || 0, cleave: card.cleave || 0, leap: card.leap || 0,
              jav: card.jav || 0, rage: !!card.rage, water: !!card.water, mobile: !!card.mobile, solo: (card.count || 1) === 1,
              ran: 0, chargeReady: false, alive: true, target: null, facing: side === 0 ? 1 : -1, born: M.t, buff: 0, bob: M.rng() * 6.28,
              strikes: 0, crossed: side === 0 ? y >= FIELD.riverY : y <= FIELD.riverY, immune: 0, slow: 0, quick: 0, flower: 0, berserk: 0,
              leapCd: 0, rt: 0, duel: null, nextMul: 1, rlast: -9, hero: card.role === 'hero' };
  M.units.push(u);
  return u;
}

function foesInLane(M, side, lane) {
  return M.units.filter(function (u) { return u.alive && u.side !== side && laneOf(u.x) === lane && !u.duel; });
}
function friendsInLane(M, side, lane) {
  return M.units.filter(function (u) { return u.alive && u.side === side && laneOf(u.x) === lane; });
}

function playCard(M, side, cardId, x, y) {
  const P = M.players[side], card = RB.CARDS[cardId];
  if (!card || M.over) return { ok: false, why: 'no card' };
  const hi = P.hand.indexOf(cardId);
  if (hi < 0) return { ok: false, why: 'not in hand' };
  const cost = cardCost(M, side, cardId, y);
  if (P.energy < cost) return { ok: false, why: 'energy' };
  const lane = laneOf(x);
  const disc = cost < card.cost;
  if (card.role === 'spell') {
    if (!castSpell(M, side, card, x, y, lane)) return { ok: false, why: 'no target in that lane' };
  } else {
    if (!canDeploy(M, side, x, y)) return { ok: false, why: 'not your ground' };
    const n = card.count || 1, made = [];
    for (let i = 0; i < n; i++) {
      const ox = n === 1 ? 0 : (i - (n - 1) / 2) * 0.05, oy = n > 2 ? ((i % 2) - 0.5) * 0.03 : 0;
      made.push(spawnUnit(M, side, card, Math.max(0.05, Math.min(0.95, x + ox)), y + oy));
    }
    event(M, { kind: 'deploy', x: x, y: y, side: side, card: cardId });
    if (card.power) heroPower(M, side, card, made[0], lane);
  }
  if (disc) event(M, { kind: 'civrule', civ: 'marathas', rule: 'hillcraft', x: x, y: y, side: side });
  P.energy -= cost;
  P.hand.splice(hi, 1); P.hand.push(P.next); P.deck.push(cardId); P.next = P.deck.shift();
  return { ok: true, cost: cost };
}

function heroPower(M, side, card, u, lane) {
  const base = { kind: 'hero', move: card.power, card: card.id, x: u.x, y: u.y, side: side, lane: lane };
  const dir = side === 0 ? 1 : -1;
  if (card.power === 'testudo') {
    for (const v of friendsInLane(M, side, lane)) v.immune = 3;
    say(M, 'Testudo. The shields close.', side);
  } else if (card.power === 'berserk') {
    for (const v of friendsInLane(M, side, lane)) v.berserk = 6;
    say(M, 'The Jarl roars. The lane goes berserk.', side);
  } else if (card.power === 'nightraid') {
    let T = M.towers.filter(function (q) { return q.side === enemyOf(side) && q.alive && laneOf(q.x) === lane && q.kind === 'outer'; })[0]
      || M.towers.filter(function (q) { return q.side === enemyOf(side) && q.alive; })[0];
    if (T) {
      const mav = RB.CARDS.marathas_mavale;
      for (let i = 0; i < 2; i++) {
        const r = spawnUnit(M, side, mav, Math.max(0.05, Math.min(0.95, T.x + (i - 0.5) * 0.06)), Math.max(0.03, Math.min(0.97, T.y + dir * 0.06)));
        r.crossed = true;
      }
      base.x = T.x; base.y = T.y;
      say(M, 'The Raje\'s night raid: two Mavale behind the tower.', side);
    }
  } else if (card.power === 'skyfall') {
    const lx = FIELD.bridges[lane], ly = FIELD.riverY + dir * 0.10;
    base.fromX = u.x; base.fromY = u.y;
    u.x = lx; u.y = ly; u.crossed = true; u.cd = 0.6;
    base.x = lx; base.y = ly;
    for (const v of M.units) {
      if (!v.alive || v.side === side || v.duel) continue;
      if (dist(u, v) < 0.20) { hit(M, u, v, 60); v.y = Math.max(0.03, Math.min(0.97, v.y + dir * 0.09)); }
    }
    say(M, 'The Eagle Knight falls from the sky.', side);
  } else if (card.power === 'duel') {
    let cands = foesInLane(M, side, lane);
    if (!cands.length) cands = M.units.filter(function (v) { return v.alive && v.side !== side && !v.duel; });
    cands.sort(function (a, b) { return b.hp - a.hp; });
    const foe = cands[0];
    if (foe) {
      u.duel = foe; foe.duel = u;
      u.x = Math.max(0.05, Math.min(0.95, foe.x - 0.04)); u.y = foe.y - dir * 0.0; u.crossed = foe.y > FIELD.riverY === (side === 0);
      u.target = foe; foe.target = u;
      base.foeCard = foe.card; base.x = foe.x; base.y = foe.y; base.locked = true;
      say(M, 'The Ronin calls out the strongest foe in the lane.', side);
    } else base.locked = false;
  } else if (card.power === 'sandstorm') {
    M.storms.push({ side: side, lane: lane, until: M.t + 4 });
    say(M, 'A sandstorm blinds the lane.', side);
  }
  event(M, base);
}

function castSpell(M, side, card, x, y, lane) {
  const pseudo = { side: side, civ: M.players[side].civ, role: 'spell', as: 'spell' };
  const k = card.spellKind, ev = { kind: 'spell', card: card.id, x: x, y: y, side: side, lane: lane };
  if (k === 'aoe') {
    const foes = foesInLane(M, side, lane); if (!foes.length) return false;
    for (const v of foes) hit(M, pseudo, v, card.dmg);
  } else if (k === 'slow') {
    const foes = foesInLane(M, side, lane); if (!foes.length) return false;
    for (const v of foes) v.slow = 5;
  } else if (k === 'tower') {
    const T = M.towers.filter(function (q) { return q.side === enemyOf(side) && q.alive && q.kind === 'outer' && laneOf(q.x) === lane; })[0]
      || M.towers.filter(function (q) { return q.side === enemyOf(side) && q.alive && q.kind === 'king'; })[0];
    if (!T) return false;
    ev.x = T.x; ev.y = T.y;
    hit(M, pseudo, T, card.dmg);
  } else if (k === 'chaos') {
    const foes = foesInLane(M, side, lane); if (!foes.length) return false;
    for (const v of foes) { v.flower = 3; v.target = null; v.rt = 0; }
  } else if (k === 'haste') {
    const fr = friendsInLane(M, side, lane); if (!fr.length) return false;
    for (const v of fr) { v.cd = 0; v.quick = 3; }
  } else if (k === 'flood') {
    M.flood = { until: M.t + 4 };
  } else return false;
  event(M, ev);
  say(M, card.name + '.', side);
  return true;
}

function pickTarget(M, u) {
  if (u.duel) return u.duel;
  let best = null, bd = 1e9;
  if (u.flower > 0) {
    for (const v of M.units) { if (!v.alive || v === u || v.side !== u.side || v.duel) continue; const d = dist(u, v); if (d < bd) { bd = d; best = v; } }
    if (best) return best;
  }
  if (u.targets !== 'buildings') for (const v of M.units) {
    if (!v.alive || v.side === u.side || v.duel) continue;
    const d = dist(u, v); if (d < bd) { bd = d; best = v; }
  }
  for (const t of M.towers) { if (!t.alive || t.side === u.side) continue; const d = dist(u, t) - 0.03; if (d < bd) { bd = d; best = t; } }
  return best;
}

function blinded(M, side, x, king) {
  for (const s of M.storms) if (s.until > M.t && s.side !== side && (king || laneOf(x) === s.lane)) return true;
  return false;
}

function tortoiseNear(M, u) {
  for (const v of M.units) if (v !== u && v.alive && v.side === u.side && fightRole(v) === 'shield' && Math.abs(v.x - u.x) < 0.07 && Math.abs(v.y - u.y) < 0.05) return true;
  return false;
}

function hit(M, from, to, dmg, o) {
  o = o || {};
  if (!to.alive || to.immune > 0) return;
  let mult = 1;
  const fr = fightRole(from);
  if (to.kind) { if (from.role === 'siege') mult = MULT; }
  else {
    const b = RB.ROLE_BEATS[fr];
    if (b && b.indexOf(fightRole(to)) >= 0) mult = MULT;
    else if (o.splash && to.role === 'swarm') mult = MULT;
  }
  dmg *= mult;
  if (!to.kind && to.civ === 'rome' && fightRole(to) === 'shield' && tortoiseNear(M, to)) { dmg *= 0.7; civrule(M, to, 'tortoise', to.x, to.y, 1.2); }
  to.hp -= dmg;
  if (to.kind === 'king') to.awake = true;
  event(M, { kind: 'hit', x: to.x, y: to.y, dmg: Math.round(dmg), side: from.side, tower: !!to.kind, role: from.role, crit: !!o.crit });
  if (to.hp <= 0 && to.alive) {
    to.hp = 0; to.alive = false;
    if (to.kind) {
      event(M, { kind: 'towerfall', tower: to.kind, x: to.x, y: to.y, side: to.side });
      M.players[to.side].towersLost++;
      for (const k of M.towers) if (k.side === to.side && k.kind === 'king') k.awake = true;
      say(M, to.kind === 'king' ? 'The gate is broken.' : 'A tower falls.', from.side);
      if (to.kind === 'king' || M.sudden) endMatch(M, from.side, to.kind === 'king' ? 'gate' : 'sudden');
    } else {
      to.died = M.t;
      event(M, { kind: 'fall', card: to.card, x: to.x, y: to.y, side: to.side });
      if (from.civ === 'aztecs' && from.side !== to.side) {
        const P = M.players[from.side];
        P.energy = Math.min(RB.MATCH.energyMax, P.energy + 1);
        event(M, { kind: 'civrule', civ: 'aztecs', rule: 'refund', x: to.x, y: to.y, side: from.side });
      }
    }
  }
}

function strike(M, u, T) {
  const slow = u.rage ? 0.5 + 0.5 * (u.hp / u.maxHp) : 1;
  u.cd = u.hitEvery * slow * (u.quick > 0 ? 0.6 : 1);
  let dmg = u.dmg * u.nextMul, crit = false, charged = false;
  u.nextMul = 1;
  if (u.charge && u.chargeReady) { dmg *= u.charge; u.chargeReady = false; charged = true; event(M, { kind: 'charge', x: u.x, y: u.y, side: u.side }); }
  if (u.civ === 'samurai' && u.solo) {
    u.strikes++;
    if (u.strikes % 4 === 0) { dmg *= 2; crit = true; civrule(M, u, 'crit', u.x, u.y, 0); }
  }
  if (u.berserk > 0) dmg *= 2;
  if (u.jav) {
    const j = u.jav; u.jav = 0;
    event(M, { kind: 'shot', x: u.x, y: u.y, tx: T.x, ty: T.y, side: u.side });
    hit(M, u, T, j);
  }
  if (u.range > 0.1) event(M, { kind: 'shot', x: u.x, y: u.y, tx: T.x, ty: T.y, side: u.side });
  hit(M, u, T, dmg, { crit: crit });
  if (u.cleave) for (const v of M.units) if (v.alive && v !== T && v.side !== u.side && !v.duel && dist(v, u) < u.cleave) hit(M, u, v, dmg * 0.8);
  const sp = u.splash || (charged ? u.chargeSplash : 0);
  if (sp) for (const v of M.units) if (v.alive && v !== T && v.side !== u.side && !v.duel && dist(v, T) < sp) hit(M, u, v, dmg * 0.6, { splash: true });
}

function stepWater(M, u, dt) {
  const sp = u.speed * (u.slow > 0 ? 0.6 : 1) * dt;
  const dy = FIELD.riverY - u.y;
  if (Math.abs(dy) > 0.01) { u.y += Math.sign(dy) * Math.min(sp, Math.abs(dy)); u.crossed = true; return; }
  u.y = FIELD.riverY; u.crossed = true;
  let best = null, bd = 1e9;
  for (const v of M.units) { if (!v.alive || v.side === u.side || v.duel || v.water) continue; const d = dist(u, v); if (d < bd) { bd = d; best = v; } }
  if (best && bd <= u.range) { if (u.cd <= 0) strike(M, u, best); return; }
  let tx = 0.5;
  if (best && Math.abs(best.y - FIELD.riverY) < 0.3) tx = best.x;
  else {
    const a = foesInLane(M, u.side, 0).length, b = foesInLane(M, u.side, 1).length;
    tx = a === b ? u.x : (a > b ? LANE_X[0] : LANE_X[1]);
  }
  const ddx = tx - u.x;
  if (Math.abs(ddx) > 0.01) { u.x += Math.sign(ddx) * Math.min(sp, Math.abs(ddx)); u.facing = ddx > 0 ? 1 : -1; }
}

function bank(y) { return y < FIELD.riverY ? 0 : 1; }

function stepUnit(M, u, dt) {
  u.cd = Math.max(0, u.cd - dt);
  for (const k of ['immune', 'slow', 'quick', 'flower', 'berserk', 'leapCd', 'rt']) if (u[k] > 0) u[k] = Math.max(0, u[k] - dt);
  if (u.berserk > 0) u.hp = Math.max(1, u.hp - u.maxHp * 0.05 * dt);
  u.buff = (u.berserk > 0 || u.immune > 0 || u.quick > 0) ? 1 : 0;
  if (u.duel && !u.duel.alive) u.duel = null;
  if (u.water) return stepWater(M, u, dt);
  let T = u.target;
  if (!T || !T.alive || u.rt <= 0 || u.flower > 0 || (u.duel && T !== u.duel) || (T.side === u.side && !u.flower)) { T = u.target = pickTarget(M, u); u.rt = 0.4; }
  if (!T) return;
  const tower = !!T.kind;
  let d = dist(u, T) - (tower ? 0.03 : 0);
  if (u.leap && u.leapCd <= 0 && d > u.range && d <= u.leap) {
    const vx = u.x - T.x, vy = u.y - T.y, L = Math.sqrt(vx * vx + vy * vy) || 1;
    u.x = T.x + vx / L * 0.04; u.y = T.y + vy / L * 0.03;
    u.leapCd = 6; u.nextMul = 1.3; u.cd = 0;
    event(M, { kind: 'charge', x: u.x, y: u.y, side: u.side, leap: true });
    d = dist(u, T) - (tower ? 0.03 : 0);
  }
  if (d <= u.range) {
    const blind = u.role === 'bow' && blinded(M, u.side, u.x, false);
    if (!blind && u.cd <= 0) strike(M, u, T);
    if (!u.mobile || d <= 0.07) { u.ran = 0; return; }
  }
  // walk: via a bridge if the moat is between us and the target
  let tx = T.x, ty = T.y, hold = false;
  const mb = bank(u.y), tb = bank(T.y);
  if (mb !== tb || Math.abs(u.y - FIELD.riverY) <= FIELD.band) {
    if (mb !== tb || Math.abs(u.y - FIELD.riverY) <= FIELD.band) {
      const dir = tb > mb ? 1 : (tb < mb ? -1 : (T.y > u.y ? 1 : -1));
      const b = Math.abs(u.x - FIELD.bridges[0]) < Math.abs(u.x - FIELD.bridges[1]) ? FIELD.bridges[0] : FIELD.bridges[1];
      const inBand = Math.abs(u.y - FIELD.riverY) <= FIELD.band;
      if (inBand) { if (mb !== tb || true) { tx = b; ty = FIELD.riverY + dir * 0.09; } }
      else if (mb !== tb) {
        const ey = FIELD.riverY - dir * 0.09;
        if (M.flood && M.flood.until > M.t) { tx = b; ty = ey; if (Math.abs(u.x - b) < 0.02 && Math.abs(u.y - ey) < 0.02) hold = true; }
        else if (Math.abs(u.x - b) > 0.03) { tx = b; ty = ey; }
        else { tx = b; ty = FIELD.riverY + dir * 0.09; }
      }
    }
  }
  if (hold) return;
  const dx = tx - u.x, dy = ty - u.y, len = Math.sqrt(dx * dx + dy * dy) || 1;
  const sp = u.speed * (u.crossed && u.civ === 'vikings' ? 1.4 : 1) * (u.slow > 0 ? 0.6 : 1) * dt;
  const step = Math.min(sp, len);
  u.x += dx / len * step; u.y += dy / len * step;
  u.facing = dy >= 0 ? 1 : -1;
  if (!u.crossed && (u.side === 0 ? u.y >= FIELD.riverY : u.y <= FIELD.riverY)) {
    u.crossed = true;
    if (u.civ === 'vikings') civrule(M, u, 'moatrush', u.x, u.y, 0);
  }
  if (u.charge) { u.ran += step; if (u.ran > 0.12) u.chargeReady = true; }
  for (const v of M.units) {
    if (v === u || !v.alive || v.water) continue;
    const ddx = u.x - v.x, ddy = (u.y - v.y) * 1.6, dd = Math.sqrt(ddx * ddx + ddy * ddy);
    if (dd < 0.035 && dd > 0.0001) { u.x += ddx / dd * 0.004; u.y += ddy / dd * 0.0025; }
  }
  u.x = Math.max(0.03, Math.min(0.97, u.x)); u.y = Math.max(0.02, Math.min(0.98, u.y));
}

function stepTower(M, t, dt) {
  if (!t.alive) return;
  const S = RB.TOWER[t.kind];
  t.cd = Math.max(0, t.cd - dt);
  let best = null, bd = 1e9, near = false;
  for (const u of M.units) {
    if (!u.alive || u.side === t.side) continue;
    const d = dist(t, u);
    if (d < S.range * 1.3) near = true;
    if (u.duel) continue;
    if (d < bd) { bd = d; best = u; }
  }
  if (t.civ === 'egypt' && !near && t.hp < t.maxHp) {
    t.hp = Math.min(t.maxHp, t.hp + t.maxHp * 0.01 * dt);
    civrule(M, t, 'repair', t.x, t.y, 3);
  }
  if (!t.awake || t.cd > 0) return;
  if (best && bd <= S.range && !blinded(M, t.side, t.x, t.kind === 'king')) {
    t.cd = S.hitEvery;
    event(M, { kind: 'shot', x: t.x, y: t.y, tx: best.x, ty: best.y, side: t.side });
    hit(M, t, best, S.dmg);
  }
}

function endMatch(M, winner, reason) {
  if (M.over) return;
  M.over = true; M.winner = winner; M.reason = reason;
  event(M, { kind: 'end', winner: winner, reason: reason });
}

function tick(M, dt) {
  if (M.over) return;
  M.t += dt;
  const late = M.t > RB.MATCH.seconds - RB.MATCH.lateAt;
  for (const P of M.players) P.energy = Math.min(RB.MATCH.energyMax, P.energy + (late ? RB.MATCH.lateEnergyPerSec : RB.MATCH.energyPerSec) * dt);
  if (M.storms.length) M.storms = M.storms.filter(function (s) { return s.until > M.t; });
  if (M.flood && M.flood.until <= M.t) M.flood = null;
  for (const u of M.units) if (u.alive) stepUnit(M, u, dt);
  for (const t of M.towers) stepTower(M, t, dt);
  for (let i = M.units.length - 1; i >= 0; i--) { const u = M.units[i]; if (!u.alive && M.t - (u.died != null ? u.died : (u.died = M.t)) > 1.5) M.units.splice(i, 1); }
  if (M.over) return;
  if (M.t >= RB.MATCH.seconds && !M.sudden) {
    const a = M.players[0].towersLost, b = M.players[1].towersLost;
    if (a !== b) endMatch(M, a < b ? 0 : 1, 'towers');
    else { M.sudden = true; say(M, 'Sudden death. The next tower decides it.', -1); event(M, { kind: 'sudden' }); }
  }
  if (M.sudden && !M.over && M.t >= RB.MATCH.seconds + RB.MATCH.overtime) {
    const h = [0, 0];
    for (const t of M.towers) if (t.alive) h[t.side] += t.hp / t.maxHp;
    endMatch(M, h[0] === h[1] ? (M.rng() < 0.5 ? 0 : 1) : (h[0] > h[1] ? 0 : 1), 'time');
  }
}

RB.newMatch = newMatch; RB.tick = tick; RB.playCard = playCard; RB.canDeploy = canDeploy; RB.cardCost = cardCost;
RB.FIELD = FIELD; RB.dist = dist; RB.laneOf = laneOf; RB.LANE_X = LANE_X;

<script>
// Epoch. An AZTMM game. (c) 2026 AZTMM HLDGS LLC.
// 03_ai.js: the opponent. Three tempers (rush, siege, counter). Every decision is a rule a person could explain:
// answer the threat with the role that beats it, spend the spell on a crowd, play the hero when energy is full and a lane is contested.
function makeAI(side, temper, rng) {
  const A = { side: side, temper: temper || 'counter', rng: rng || Math.random, nextThink: 1.0, lastLane: 0, fullSince: -1 };
  const foe = 1 - side;
  const LX = [0.25, 0.75];
  const ORDER = {
    rush:    ['horse', 'swarm', 'blade', 'bow', 'shield', 'siege'],
    siege:   ['siege', 'shield', 'bow', 'blade', 'swarm', 'horse'],
    counter: ['blade', 'shield', 'horse', 'bow', 'swarm', 'siege']
  }[A.temper] || ['blade', 'shield', 'horse', 'bow', 'swarm', 'siege'];
  const MINE = { rush: 3, siege: 6.5, counter: 8 }[A.temper] || 6;
  const lane = function (x) { return x < 0.5 ? 0 : 1; };
  const inMyHalf = function (u) { return side === 0 ? u.y < 0.5 : u.y > 0.5; };
  const yAt = function (civ, frac) { return side === 0 ? (civ === 'marathas' ? 0.14 : frac) : (civ === 'marathas' ? 0.86 : 1 - frac); };
  const FRAC = { shield: 0.34, blade: 0.32, swarm: 0.32, bow: 0.22, horse: 0.30, siege: 0.34, hero: 0.30 };
  const beatersOf = function (r) { const out = []; for (const k in RB.ROLE_BEATS) if (RB.ROLE_BEATS[k].indexOf(r) >= 0) out.push(k); return out; };
  const fr = function (u) { return u.as || u.role; };

  A.think = function (M) {
    if (M.over || M.t < A.nextThink) return null;
    A.nextThink = M.t + 0.4 + A.rng() * 0.5;
    const P = M.players[side], civ = P.civ;
    const cardOf = function (id) { return RB.CARDS[id]; };
    const x = function (l) { return Math.max(0.08, Math.min(0.92, LX[l] + (A.rng() - 0.5) * 0.08)); };
    const costAt = function (id, l) { return RB.cardCost(M, side, id, yAt(civ, FRAC[cardOf(id).role] || 0.3)); };
    const play = function (id, l) { const c = cardOf(id); return RB.playCard(M, side, id, x(l), yAt(civ, FRAC[c.role] || 0.3)); };
    const spellAt = function (id, l) { return RB.playCard(M, side, id, LX[l], 0.5); };
    const canPay = function (id) { return P.energy >= costAt(id, 0); };
    const mine = [[], []], foes = [[], []];
    for (const u of M.units) if (u.alive) (u.side === side ? mine : foes)[lane(u.x)].push(u);
    const sum = function (a) { return a.reduce(function (s, u) { return s + u.hp; }, 0); };
    const hand = P.hand.map(cardOf);
    const spell = hand.filter(function (c) { return c.role === 'spell'; })[0];
    const hero = hand.filter(function (c) { return c.role === 'hero'; })[0];
    const myOuter = M.towers.filter(function (t) { return t.side === side && t.kind === 'outer'; });
    const foeOuter = M.towers.filter(function (t) { return t.side === foe && t.kind === 'outer'; });

    // 1. Spell on a crowded lane
    if (spell && canPay(spell.id)) {
      const k = spell.spellKind;
      for (let pass = 0; pass < 2; pass++) {
        const l = pass === 0 ? A.lastLane : 1 - A.lastLane;
        const F = foes[l], Mn = mine[l];
        let ok = false;
        if (k === 'aoe' || k === 'slow') ok = F.length >= 3;
        else if (k === 'chaos') ok = F.length >= 3 && F.filter(inMyHalf).length >= 1;
        else if (k === 'tower') {
          const t = foeOuter.filter(function (q) { return q.alive && lane(q.x) === l; })[0];
          ok = !!t && (t.hp <= 420 || (P.energy >= 9.5 && Mn.length >= 1));
        } else if (k === 'haste') ok = Mn.length >= 2 && F.some(function (f) { return Mn.some(function (m) { return RB.dist(f, m) < 0.12; }); });
        else if (k === 'flood') ok = F.length >= 3 && F.every(function (u) { return !inMyHalf(u); }) && F.some(function (u) { return Math.abs(u.y - 0.5) < 0.2; });
        if (ok) { const r = spellAt(spell.id, l); if (r && r.ok) return r; }
      }
    }

    // 2. Threat in my half: answer with the role that beats it
    let worst = null, wl = 0;
    for (let l = 0; l < 2; l++) for (const u of foes[l]) if (inMyHalf(u)) {
      if (!worst || (side === 0 ? u.y < worst.y : u.y > worst.y)) { worst = u; wl = l; }
    }
    if (worst) {
      const group = foes[wl].filter(inMyHalf), tHp = sum(group);
      const mHp = sum(mine[wl].filter(inMyHalf));
      const byRole = {};
      for (const u of group) byRole[fr(u)] = (byRole[fr(u)] || 0) + u.hp;
      let tr = fr(worst), top = -1;
      for (const r in byRole) if (byRole[r] > top) { top = byRole[r]; tr = r; }
      if (hero && P.energy >= cardOf(hero.id).cost && tHp >= 450 && mHp < tHp * 0.6) { const r = play(hero.id, wl); if (r && r.ok) return r; }
      if (mHp < tHp * 1.3) {
        const beaters = beatersOf(tr);
        let best = null, bs = -99;
        for (const c of hand) {
          if (c.role === 'spell' || c.role === 'hero' || c.role === 'siege' || !canPay(c.id)) continue;
          let s = 0;

// A card's figure in miniature for the hand. s is the unit scale, so size to fit a box of boxH px.
function drawCardFigure(ctx, card, s, M, side, boxH) {
  const key = card.civ || card.faction;
  const cid = card.id;
  if (RB.drawFigure) {
    let k = s;
    if (boxH) { const h = figHeight(cid, card); k = Math.min(s, boxH / Math.max(1.2, h)); }
    try { drawSprite(ctx, cid, 0, k, 0, roleOf(card) === 'hero', 1); return; } catch (e) { /* fall through */ }
  }
  const pal = card.faction === 'epic' ? { body: LOOK.epic, dark: '#a06a10', cloth: '#fff2cc', metal: '#f5e4a0', flag: LOOK.epic } : civPal(key);
  if (card.body === 'epic' || roleOf(card) === 'spell') { drawHanumanFigure(ctx, s, 0); return; }

// ---------- effects ----------
function lighten(hex, k) { const n = parseInt(String(hex).replace('#', ''), 16); const r = n >> 16, g = (n >> 8) & 255, b = n & 255; const m = function (c) { return Math.round(c + (255 - c) * k); }; return 'rgb(' + m(r) + ',' + m(g) + ',' + m(b) + ')'; }

    }

// ---------- HUD ----------
function towersLeft(M, side) { return Math.max(0, 3 - M.players[side].towersLost); }
function drawPips(ctx, x, y, n, d, col, align) {
  for (let i = 0; i < 3; i++) { const cx = align === 'right' ? x - d * 0.5 - i * d * 1.5 : x + d * 0.5 + i * d * 1.5; ctx.fillStyle = i < n ? col : 'rgba(255,255,255,0.12)'; ctx.fillRect(cx - d * 0.45, y - d * 0.6, d * 0.9, d * 1.2); ctx.fillRect(cx - d * 0.45, y - d * 0.9, d * 0.28, d * 0.3); ctx.fillRect(cx + d * 0.17, y - d * 0.9, d * 0.28, d * 0.3); }
}
function drawHud(ctx, L, M, view, now) {
  const u = L.unit, W = L.W, T = L.top;
  ctx.fillStyle = LOOK.bg; ctx.fillRect(0, 0, W, L.fy);
  const left = Math.max(0, RB.MATCH.seconds - M.t);
  const over = M.sudden ? Math.max(0, RB.MATCH.seconds + RB.MATCH.overtime - M.t) : left;
  const mm = Math.floor(over / 60), ss = Math.floor(over % 60);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center'; ctx.fillStyle = M.sudden ? LOOK.red : (left < 60 ? LOOK.energy : LOOK.paper);
  ctx.font = 'bold ' + Math.round(T * 0.46) + 'px system-ui, sans-serif';
  ctx.fillText(mm + ':' + (ss < 10 ? '0' : '') + ss, W / 2, T * 0.42);
  ctx.font = Math.round(T * 0.21) + 'px system-ui, sans-serif'; ctx.fillStyle = M.sudden ? LOOK.red : LOOK.haze;
  ctx.fillText(M.sudden ? 'SUDDEN DEATH' : (left < 60 ? 'DOUBLE ENERGY' : 'EPOCH'), W / 2, T * 0.82);
  // each side: crest, civ name, towers left
  const cr = T * 0.34;
  for (const side of [view.side, 1 - view.side]) {
    const mine = side === view.side, key = civKey(M, side), info = civInfo(key), pal = civPal(key);
    const cx = mine ? u * 0.8 + cr : W - u * 0.8 - cr;
    drawCrest(ctx, key, cx, T * 0.5, cr, false);
    ctx.textAlign = mine ? 'left' : 'right';
    const tx = mine ? cx + cr + u * 0.5 : cx - cr - u * 0.5;
    ctx.fillStyle = LOOK.paper; ctx.font = 'bold ' + Math.round(T * 0.26) + 'px system-ui, sans-serif';
    ctx.fillText(info.name || key, tx, T * 0.34);
    drawPips(ctx, tx, T * 0.74, towersLeft(M, side), T * 0.14, mine ? pal.body : '#d9604c', mine ? 'left' : 'right');
  }

  const last = M.log[M.log.length - 1];
  if (last && M.t - last.t < 3.5) {
    ctx.font = Math.round(u * 0.75) + 'px system-ui, sans-serif';
    ctx.globalAlpha = Math.min(1, (3.5 - (M.t - last.t)) * 1.5);
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; const tw = ctx.measureText(last.text).width + u * 2; ctx.fillRect(W / 2 - tw / 2, L.fy + u * 0.4, tw, u * 1.3);

}

function drawDrum(ctx, L, energy, now, view) {
  const u = L.unit, W = L.W, by = L.H - L.bottom;
  const x0 = u * 0.8, w = W - u * 1.6, h = u * 1.1, y = by + u * 0.5;
  ctx.fillStyle = '#3b2a1c'; roundRect(ctx, x0 - 4, y - 4, w + 8, h + 8, 8); ctx.fill();
  ctx.fillStyle = LOOK.energyDim; roundRect(ctx, x0, y, w, h, 6); ctx.fill();
  const segs = RB.MATCH.energyMax, gap = 3, sw = (w - gap * (segs - 1)) / segs;
  const beat = view.beat ? Math.max(0, 1 - (now - view.beat) * 6) : 0;
  for (let i = 0; i < segs; i++) {
    const f = Math.max(0, Math.min(1, energy - i));

    ctx.fillStyle = LOOK.energy; ctx.globalAlpha = 0.65 + 0.35 * f + beat * 0.2;

  ctx.fillStyle = LOOK.paper; ctx.font = 'bold ' + Math.round(u * 0.75) + 'px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(Math.floor(energy), x0 + u * 0.4, y + h / 2);
}

function handRects(L) {
  const u = L.unit, W = L.W, by = L.H - L.bottom;
  const y = by + u * 2.0, h = L.bottom - u * 2.4, nextW = u * 1.8;

  const r = [];
  for (let i = 0; i < 4; i++) r.push({ x: x0 + i * (w + u * 0.4), y: y, w: w, h: h });
  return { cards: r, next: { x: u * 0.8, y: y + h * 0.35, w: nextW, h: h * 0.65 } };
}

function drawSpellGlyph(ctx, s, col) {
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = s * 0.12; ctx.lineCap = 'round';
  ctx.beginPath(); for (let i = 0; i < 16; i++) { const a = i * 0.3927, r = i % 2 ? s * 0.45 : s * 1.1; ctx.lineTo(Math.cos(a) * r, -s * 0.9 + Math.sin(a) * r); } ctx.closePath(); ctx.globalAlpha = 0.9; ctx.fill(); ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff6dc'; ctx.beginPath(); ctx.arc(0, -s * 0.9, s * 0.3, 0, 6.283); ctx.fill();
}

function drawHand(ctx, L, M, P, view, now) {
  const u = L.unit, R = handRects(L);
  ctx.textBaseline = 'middle';
  for (let i = 0; i < 4; i++) {
    const id = P.hand[i]; if (!id) continue;
    const c = RB.CARDS[id], r = R.cards[i], can = P.energy >= c.cost, held = view.holding === id;
    const role = roleOf(c), hero = role === 'hero', spell = role === 'spell';
    const pal = civPal(c.civ || c.faction), edge = hero ? LOOK.epic : (spell ? '#a878e0' : pal.body);
    const lift = held ? -u * 0.6 : 0, y = r.y + lift;
    // body
    const gr = ctx.createLinearGradient(0, y, 0, y + r.h); gr.addColorStop(0, held ? '#46372a' : '#33291f'); gr.addColorStop(1, held ? '#2c2219' : '#1f1812');
    ctx.fillStyle = gr; roundRect(ctx, r.x, y, r.w, r.h, 8); ctx.fill();
    ctx.save(); roundRect(ctx, r.x, y, r.w, r.h, 8); ctx.clip();
    ctx.fillStyle = edge; ctx.globalAlpha = can ? 0.9 : 0.35; ctx.fillRect(r.x, y + r.h - u * 1.55, r.w, u * 1.55); ctx.globalAlpha = 1;
    if (hero) { const sh = ctx.createLinearGradient(r.x, y, r.x + r.w, y + r.h); sh.addColorStop(0, 'rgba(245,192,74,0.25)'); sh.addColorStop(1, 'rgba(245,192,74,0)'); ctx.fillStyle = sh; ctx.fillRect(r.x, y, r.w, r.h); }
    ctx.restore();
    ctx.strokeStyle = held ? '#fff1c0' : (can ? edge : '#3a3028'); ctx.lineWidth = held ? 2.5 : (hero ? 2.2 : 1.5); roundRect(ctx, r.x, y, r.w, r.h, 8); ctx.stroke();

  }
  function move(ev) {

  }
  function up(ev) {

  canvas.addEventListener('mousedown', down); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  canvas.addEventListener('touchstart', down, { passive: false }); canvas.addEventListener('touchmove', move, { passive: false }); window.addEventListener('touchend', up, { passive: false });
  window.addEventListener('keydown', function (ev) {

  });

  // ---------- title and end screens ----------
  function titleGeo() {
    const u = L.unit, W = L.W, H = L.H, ks = keys(), n = ks.length, slot = Math.min(W / n, u * 5.2), cr = Math.min(slot * 0.4, u * 2.1);

  }
  function titleTap(p) {

  }
  function endButtons() { const u = L.unit, W = L.W, H = L.H, w = Math.min(W - u * 3, u * 20), h = u * 3.3; const y = G.endBtnY || H * 0.66; return { again: { x: (W - w) / 2, y: y, w: w, h: h }, title: { x: (W - w) / 2, y: y + h + u * 0.8, w: w, h: h * 0.85 } }; }
  function endTap(p) { const B = endButtons(); if (hitRect(p, B.again)) { rollFoe(); startMatch(); } else if (hitRect(p, B.title)) { G.screen = 'title'; rollFoe(); sfx('tap'); } }

  function button(r, text, active, big) {
    const u = L.unit, pal = RB.civPal(G.civ);
    const g = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
    if (active) { g.addColorStop(0, '#ffd36a'); g.addColorStop(1, '#d9962a'); } else { g.addColorStop(0, '#32271e'); g.addColorStop(1, '#241b14'); }
    ctx.fillStyle = g; RB.roundRect(ctx, r.x, r.y, r.w, r.h, r.h / 2); ctx.fill();

  }
  function spaced(text, cx, y, sp) {
    let w = 0; for (const ch of text) w += ctx.measureText(ch).width + sp; w -= sp;
    let x = cx - w / 2; const al = ctx.textAlign; ctx.textAlign = 'left';
    for (const ch of text) { ctx.fillText(ch, x, y); x += ctx.measureText(ch).width + sp; }
    ctx.textAlign = al;
  }
  function brand(y) {
    const u = L.unit;
    ctx.fillStyle = '#8a7f70'; ctx.font = Math.round(u * 0.6) + 'px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('An AZTMM game', L.W / 2, y); ctx.fillText('© 2026 AZTMM HLDGS LLC', L.W / 2, y + u * 0.9);
  }
  function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }
  function heroOf(key) { const i = info(key); if (i.hero && RB.CARDS[i.hero]) return i.hero; const d = RB.DECKS[key]; return d ? d[d.length - 1] : null; }
  function stageFigure(key, x, y, s, now, flip) {

    if (RB.drawFigure && id) { try { RB.drawFigure(ctx, id, flip ? 1 : 0, s, now * 3, { hurt: 0, hero: true, buff: false, facing: flip ? -1 : 1 }); ok = true; } catch (e) { ok = false; } }
    if (!ok) { if (flip) ctx.scale(-1, 1); RB.drawMan(ctx, s, RB.civPal(key), now * 2 + (flip ? 1 : 0), 'commander', flip ? 1 : 0, 0); }
    ctx.restore();
  }
  function drawTitle(now) {
    const u = L.unit, W = L.W, H = L.H, B = titleGeo(), pal = RB.civPal(G.civ), fpal = RB.civPal(G.foe);
    ctx.fillStyle = RB.LOOK.bg; ctx.fillRect(0, 0, W, H);
    // dusk sky tinted by the chosen civ
    const sky = ctx.createLinearGradient(0, 0, 0, B.stage + u * 2); sky.addColorStop(0, '#0f0c0a'); sky.addColorStop(0.55, hexA(pal.dark, 0.75)); sky.addColorStop(1, hexA(pal.body, 0.55));
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, B.stage + u * 2);
    const gy = B.stage + u * 1.5; ctx.fillStyle = hexA(pal.flag, 0.30); ctx.beginPath(); ctx.arc(W / 2, gy, u * 10.5, Math.PI, 0); ctx.fill();
    ctx.fillStyle = hexA(pal.metal, 0.45); ctx.beginPath(); ctx.arc(W / 2, gy, u * 6.8, Math.PI, 0); ctx.fill();
    ctx.fillStyle = 'rgba(255,246,220,0.55)'; for (let i = 0; i < 38; i++) { const sx = ((i * 0.6180339 * 7.31) % 1) * W, sy = (((i * 0.3819 * 5.17) + 0.07) % 1) * (B.stage - u * 8) + u * 1, tw = 0.5 + 0.5 * Math.sin(now * 1.5 + i * 2.1); ctx.globalAlpha = 0.25 + 0.4 * tw; ctx.fillRect(sx, sy, i % 5 === 0 ? 2.2 : 1.4, i % 5 === 0 ? 2.2 : 1.4); } ctx.globalAlpha = 1;
    // far ridge and walls
    ctx.fillStyle = '#1d1712'; ctx.beginPath(); ctx.moveTo(0, gy);
    for (let x = 0; x <= W; x += W / 30) { const k = x / W; ctx.lineTo(x, gy - Math.abs(Math.sin(k * 8 + 1)) * u * 1.3 - Math.abs(Math.sin(k * 21)) * u * 0.4); }
    ctx.lineTo(W, gy + u * 2); ctx.lineTo(0, gy + u * 2); ctx.closePath(); ctx.fill();
    // the ground the two stand on
    const gr = ctx.createLinearGradient(0, gy - u, 0, gy + u * 5); gr.addColorStop(0, '#2a2119'); gr.addColorStop(1, '#14110e'); ctx.fillStyle = gr; ctx.fillRect(0, gy - u * 0.4, W, u * 6);
    // the two heroes
    const s = u * 3.0;
    stageFigure(G.civ, W * 0.27, B.stage + u * 2.2, s, now, false);
    stageFigure(G.foe, W * 0.73, B.stage + u * 2.2, s, now, true);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = RB.LOOK.paper; ctx.font = 'bold ' + Math.round(u * 1.3) + 'px system-ui, sans-serif'; ctx.globalAlpha = 0.9; ctx.fillText('VS', W / 2, B.stage - u * 2.2); ctx.globalAlpha = 1;
    ctx.font = 'bold ' + Math.round(u * 0.8) + 'px system-ui, sans-serif'; ctx.fillStyle = pal.body === '#000' ? '#fff' : RB.LOOK.paper;
    ctx.fillText(info(G.civ).name || G.civ, W * 0.27, B.stage + u * 4.6);
    ctx.fillText(info(G.foe).name || G.foe, W * 0.73, B.stage + u * 4.6);
    ctx.font = Math.round(u * 0.55) + 'px system-ui, sans-serif'; ctx.fillStyle = RB.LOOK.haze;
    ctx.fillText('YOU', W * 0.27, B.stage + u * 5.6); ctx.fillText('OPPONENT  ↻', W * 0.73, B.stage + u * 5.6);
    // the name
    const grad = ctx.createLinearGradient(0, H * 0.09, 0, H * 0.2); grad.addColorStop(0, '#fff6dc'); grad.addColorStop(1, RB.LOOK.energy);
    ctx.fillStyle = grad; ctx.font = '800 ' + Math.round(u * 4.6) + 'px system-ui, sans-serif'; spaced('EPOCH', W / 2, H * 0.135, u * 0.55);
    ctx.fillStyle = RB.LOOK.haze; ctx.font = Math.round(u * 0.72) + 'px system-ui, sans-serif'; spaced('THE WORLD\'S FIGHTING CULTURES. ONE FIELD.', W / 2, H * 0.135 + u * 3.0, u * 0.12);
    // crest row
    ctx.fillStyle = RB.LOOK.paper; ctx.font = Math.round(u * 0.62) + 'px system-ui, sans-serif'; spaced('CHOOSE YOUR PEOPLE', W / 2, B.crests[0].cy - B.cr - u * 1.5, u * 0.14);
    for (const c of B.crests) {
      const sel = c.key === G.civ;
      ctx.save(); ctx.globalAlpha = sel ? 1 : 0.62;
      RB.drawCrest(ctx, c.key, c.cx, c.cy - (sel ? u * 0.3 : 0), c.r * (sel ? 1.12 : 0.95), sel);
      ctx.restore();
      if (sel) { ctx.fillStyle = RB.civPal(c.key).body; ctx.beginPath(); ctx.arc(c.cx, c.cy + c.r * 1.12 + u * 0.35, 3, 0, 6.283); ctx.fill(); }
    }
    // the chosen civ in a line or two
    const I = info(G.civ), cy = B.crests[0].cy + B.cr + u * 1.6;
    ctx.fillStyle = RB.LOOK.paper; ctx.font = 'bold ' + Math.round(u * 1.05) + 'px system-ui, sans-serif'; ctx.fillText(I.name || G.civ, W / 2, cy);
    ctx.fillStyle = RB.LOOK.haze; ctx.font = Math.round(u * 0.68) + 'px system-ui, sans-serif'; const by2 = wrapText(I.blurb || '', W / 2, cy + u * 1.5, Math.min(W - u * 3, u * 21), u * 1.05, 2);
    if (I.ruleName) { ctx.fillStyle = RB.civPal(G.civ).body; ctx.font = 'bold ' + Math.round(u * 0.62) + 'px system-ui, sans-serif'; ctx.fillText(I.ruleName.toUpperCase(), W / 2, by2 + u * 1.7); ctx.fillStyle = RB.LOOK.haze; ctx.font = Math.round(u * 0.62) + 'px system-ui, sans-serif'; wrapText(I.ruleText || '', W / 2, by2 + u * 2.7, Math.min(W - u * 3, u * 21), u * 0.95, 2); }
    button(B.go, 'To the field', true, true);
    brand(H - u * 2.4);
  }
  function drawEnd(now) {
    const u = L.unit, W = L.W, H = L.H;
    if (!G.endBg || G.endBg.w !== canvas.width || G.endBg.h !== canvas.height) {
      RB.drawMatch(ctx, L, G.M, G.view, G.fx, G.clock); ctx.fillStyle = 'rgba(10,8,6,0.92)'; ctx.fillRect(0, 0, W, H);
      const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height; c.getContext('2d').drawImage(canvas, 0, 0); G.endBg = { c: c, w: canvas.width, h: canvas.height };
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(G.endBg.c, 0, 0); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const wkey = G.winKey || G.civ, wp = RB.civPal(wkey);
    RB.drawCrest(ctx, wkey, W / 2, H * 0.17, u * 3.2, true);
    ctx.fillStyle = G.won ? RB.LOOK.energy : '#e0705c'; ctx.font = '800 ' + Math.round(u * 2.5) + 'px system-ui, sans-serif';
    spaced(G.won ? 'VICTORY' : 'DEFEAT', W / 2, H * 0.3, u * 0.35);
    ctx.fillStyle = wp.body; ctx.fillRect(W / 2 - u * 2, H * 0.3 + u * 2.0, u * 4, 2);
    ctx.fillStyle = RB.LOOK.paper; ctx.font = 'italic ' + Math.round(u * 1.05) + 'px Georgia, serif';
    const ly = wrapText('“' + G.verdict + '”', W / 2, H * 0.42, Math.min(W - u * 4, u * 21), u * 1.7, 6);
    ctx.fillStyle = '#9a8f7e'; ctx.font = Math.round(u * 0.68) + 'px system-ui, sans-serif'; ctx.fillText('The bard of ' + G.verdictBy, W / 2, ly + u * 2.2);
    G.endBtnY = ly + u * 6; const B = endButtons();

  }
  function wrapText(text, x, y, maxW, lh, maxLines) {
    const words = text.split(' '); let line = '', yy = y, n = 0;
    for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line, x, yy); line = w; yy += lh; n++; } else line = t; }
    if (line) ctx.fillText(line, x, yy);

  }

  // ---------- loop ----------
  function drawSlowmo(rn) {
    const u = L.unit, a = Math.min(1, G.slow / 0.15, (0.8 - G.slow) / 0.1 + 0.3);
    const g = ctx.createRadialGradient(L.W / 2, L.fy + L.fh / 2, L.fh * 0.25, L.W / 2, L.fy + L.fh / 2, L.fh * 0.7);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,' + (0.7 * a) + ')');
    ctx.fillStyle = g; ctx.fillRect(L.fx, L.fy, L.fw, L.fh);
    const bar = u * 1.2 * Math.min(1, a * 1.5); ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(L.fx, L.fy, L.fw, bar); ctx.fillRect(L.fx, L.fy + L.fh - bar, L.fw, bar);
  }
  function frame(ms) {
    const rn = ms / 1000;
    const dt = Math.min(0.1, rn - (G.lastT || rn)); G.lastT = rn;
    if (G.screen === 'match' || (G.screen === 'end' && !G.M.over)) {
      const M = G.M, V = G.view;
      // the feel: scale the sim's dt here, never inside RB.tick
      let scale = 1;
      if (G.freeze > 0) { scale = 0; G.freeze = Math.max(0, G.freeze - dt); }
      else if (G.slow > 0) { scale = 0.35; G.slow = Math.max(0, G.slow - dt); if (G.slow === 0 && G.pendingHit) { G.pendingHit = false; sfx('towerfall'); V.shake = 1; V.punch = Math.max(V.punch, 0.6); G.slowAt = null; } }
      G.clock += dt * scale; G.acc += dt * scale;

      drum(M, G.clock);
      V.shake = Math.max(0, V.shake - dt * 2.5); V.punch = Math.max(0, V.punch - dt * 2.2);
      let z = 1 + 0.02 * V.punch, fp = { x: L.W / 2, y: L.fy + L.fh / 2 };
      if (G.slow > 0 && G.slowAt) { const k = Math.sin(Math.min(1, (0.8 - G.slow) / 0.8) * 3.14159); z += 0.045 * k; fp = RB.toScreen(L, G.slowAt.x, G.slowAt.y); }

        const tw = ctx.measureText(V.note.text).width + L.unit * 2, ny = L.fy + L.fh - L.unit * 5; ctx.fillRect(L.W / 2 - tw / 2, ny, tw, L.unit * 1.4);

  }
  requestAnimationFrame(frame);

  // For the Playwright run and the console
  window.EPOCH = { G: G, start: startMatch, setScreen: function (s) { G.screen = s; }, RB: RB, mute: function () { AUD.on = false; }, bard: BARD };
})();
